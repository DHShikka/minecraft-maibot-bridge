# ============================================================================
#  MaiBot AI Bridge —— Minecraft Forge 1.20.1 客户端模组
#  构建属性（Gradle / ForgeGradle 配置）
# ============================================================================

# Gradle 自身配置
# Minecraft 反编译过程需要较多内存，3G 是官方 MDK 的推荐值
org.gradle.jvmargs=-Xmx3G
# 保留守护进程以加快反复构建；如需彻底干净构建可临时改为 true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# 如需固定某个 JDK，可取消下面这行的注释并改成你自己的绝对路径：
# org.gradle.java.home=C:\\path\\to\\jdk-17
# 默认使用 JAVA_HOME 指向的 JDK 17（本项目要求 Java 17）


## Environment Properties

# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.20.1,1.21)
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=47.4.10
# The Forge version range can use any version of Forge as bounds or match the loader version range
forge_version_range=[47,)
# The loader version range can only use the major version of Forge/FML as bounds
loader_version_range=[47,)
# The mapping channel to use for mappings.
mapping_channel=official
# The mapping version to query from the mapping channel.
mapping_version=1.20.1


## Mod Properties

# 模组唯一标识，必须匹配主类 @Mod 注解中的字符串
mod_id=mcai_bridge
# 模组显示名称
mod_name=MaiBot AI Bridge
# 许可证
mod_license=MIT
# 模组版本
mod_version=1.0.0
# 基础包名，需与源码目录一致
mod_group_id=com.mcai.bridge
# 作者
mod_authors=McAiBridge Contributors
# 描述（\n 会被正确替换为换行）
mod_description=A Minecraft Forge 1.20.1 client mod that bridges the game to MaiBot over WebSocket.\nMaiBot gets full perception (chat, state, entities, blocks) and full control (move, mine, place, attack, use, chat, commands).\n\u914d\u5957 MaiBot \u63d2\u4ef6\u4f4d\u4e8e maibot-plugin/ \u76ee\u5f55\u3002
