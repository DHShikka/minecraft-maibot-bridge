modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# 本模组是纯客户端模组：它不注册任何方块/物品/网络包，
# 只在客户端本地操作玩家实体并把状态同步给 MaiBot。
clientSideOnly=true

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
